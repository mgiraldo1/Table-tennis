<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Tennis</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1b2a; color: #e0e6ed;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: #8fb8de; }
  .wrap { position: relative; width: 800px; max-width: 96vw; }
  canvas { display: block; width: 100%; height: auto; background: #2e7d32; border: 4px solid #e0e6ed;
    border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); box-sizing: border-box; }
  .hint { font-size: 14px; color: #8fa3b8; text-align: center; }
  kbd { background: #22364b; padding: 2px 7px; border-radius: 4px; border: 1px solid #3a526b; }

  #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,20,32,.82); border-radius: 6px; }
  #menu.hidden { display: none; }
  .panel { background: #14293d; border: 1px solid #3a526b; border-radius: 12px; padding: 24px 32px;
    text-align: center; min-width: 300px; }
  .panel h2 { margin: 0 0 4px; font-size: 22px; }
  .panel .sub { margin: 0 0 18px; font-size: 13px; color: #8fa3b8; min-height: 18px; }
  .label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8fb8de; margin: 14px 0 8px; }
  .row { display: flex; gap: 8px; justify-content: center; align-items: center; }
  button { font: inherit; cursor: pointer; color: #e0e6ed; background: #22364b; border: 1px solid #3a526b;
    border-radius: 8px; padding: 8px 16px; }
  button:hover { background: #2b4560; }
  button.sel { background: #e63946; border-color: #ff6b76; color: #fff; }
  .diff button { min-width: 82px; }
  .step { width: 38px; padding: 8px 0; font-size: 18px; line-height: 1; }
  #pts { width: 64px; text-align: center; font: inherit; font-size: 20px; padding: 6px; color: #e0e6ed;
    background: #0d1b2a; border: 1px solid #3a526b; border-radius: 8px; }
  #start { margin-top: 22px; width: 100%; padding: 12px; font-size: 17px; font-weight: 600;
    background: #2a9d5c; border-color: #46c27a; color: #fff; }
  #start:hover { background: #31b46a; }
  #over { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,20,32,.78); border-radius: 6px; }
  #over.hidden { display: none; }
  #over .row button { min-width: 110px; padding: 10px 16px; font-weight: 600; }
  #again { background: #2a9d5c; border-color: #46c27a; color: #fff; }
  #again:hover { background: #31b46a; }
  #exit { background: #8c2f39; border-color: #c0505b; color: #fff; }
  #exit:hover { background: #a63a46; }
  .desc { font-size: 12px; color: #8fa3b8; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<h1>Table Tennis</h1>

<div class="wrap">
  <canvas id="game" width="800" height="500"></canvas>

  <div id="menu">
    <div class="panel">
      <h2>Game setup</h2>
      <p class="sub" id="menuSub">Choose your settings, then start</p>

      <div class="label">Difficulty</div>
      <div class="row diff" id="diffRow">
        <button data-d="easy">Easy</button>
        <button data-d="medium" class="sel">Medium</button>
        <button data-d="hard">Hard</button>
      </div>
      <div class="desc" id="diffDesc"></div>

      <div class="label">Points to win</div>
      <div class="row">
        <button class="step" id="minus" aria-label="Decrease">−</button>
        <input id="pts" type="number" min="1" max="30" value="11" inputmode="numeric">
        <button class="step" id="plus" aria-label="Increase">+</button>
      </div>

      <div class="label">Background image (optional)</div>
      <div class="row">
        <input id="bgFile" type="file" accept="image/*" style="font-size:12px;max-width:220px">
        <button id="bgClear" class="step" style="width:auto;padding:6px 10px;font-size:12px" title="Remove image">Clear</button>
      </div>

      <button id="start">Start game</button>
    </div>
  </div>

  <div id="over" class="hidden">
    <div class="panel">
      <h2 id="overTitle"></h2>
      <p class="sub" id="overScore"></p>
      <div class="row">
        <button id="again">Play again</button>
        <button id="exit">Exit</button>
      </div>
    </div>
  </div>
</div>

<div class="hint"><kbd>↑</kbd> <kbd>↓</kbd> move paddle &nbsp;·&nbsp; <kbd>Space</kbd> serve / pause &nbsp;·&nbsp; <kbd>Esc</kbd> back to setup</div>

  // Difficulty presets
  const LEVELS = {
    easy:   { label: 'Easy',   aiSpeed: 190, reaction: 0.62, jitter: 120, serve: 220, maxSpeed: 460, accel: 1.03, paddleH: 120,
              desc: 'Big paddles, a slow ball and a forgetful computer.' },
    medium: { label: 'Medium', aiSpeed: 300, reaction: 0.45, jitter: 60,  serve: 340, maxSpeed: 780, accel: 1.06, paddleH: 85,
              desc: 'A fair match. The computer makes occasional mistakes.' },
    hard:   { label: 'Hard',   aiSpeed: 400, reaction: 0.15, jitter: 14,  serve: 400, maxSpeed: 920, accel: 1.08, paddleH: 62,
              desc: 'Small paddles, a fast ball and a sharp computer.' }
  };
  let level = LEVELS.medium;
  let winScore = 11;

  const player = { x: 24, y: H / 2 - PADDLE_H / 2, score: 0 };
  const cpu    = { x: W - 24 - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0, targetY: H / 2, jitter: 0 };
  const ball   = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: 340 };

  const keys = { up: false, down: false };
  let state = 'menu'; // menu | ready | playing | paused | point | over
  let message = '';
  let serveDir = 1;
  let last = performance.now();

  // ---------- Menu ----------
  const menu = document.getElementById('menu');
  const menuSub = document.getElementById('menuSub');
  const diffRow = document.getElementById('diffRow');
  const diffDesc = document.getElementById('diffDesc');
  const ptsInput = document.getElementById('pts');

  function clampPts(v) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = 11;
    return Math.max(1, Math.min(30, v));
  }
  function selectLevel(key) {
    level = LEVELS[key];
    diffRow.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.d === key));
    diffDesc.textContent = level.desc;
  }
  diffRow.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) selectLevel(b.dataset.d);
  });
  document.getElementById('minus').addEventListener('click', () => { ptsInput.value = clampPts(ptsInput.value) - 1 < 1 ? 1 : clampPts(ptsInput.value) - 1; });
  document.getElementById('plus').addEventListener('click', () => { ptsInput.value = Math.min(30, clampPts(ptsInput.value) + 1); });
  ptsInput.addEventListener('change', () => { ptsInput.value = clampPts(ptsInput.value); });
  document.getElementById('start').addEventListener('click', startGame);

  // Optional background image: set BG_IMAGE_SRC to a file path/URL/data URI, or pick a file in the menu
  const BG_IMAGE_SRC = '';
  let bgImg = null;
  function loadBg(src) {
    const img = new Image();
    img.onload = () => { bgImg = img; };
    img.src = src;
  }
  if (BG_IMAGE_SRC) loadBg(BG_IMAGE_SRC);
  document.getElementById('bgFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) loadBg(URL.createObjectURL(f));
  });
  document.getElementById('bgClear').addEventListener('click', () => {
    bgImg = null;
    document.getElementById('bgFile').value = '';
  });
  selectLevel('medium');

  // ---------- Game-over screen ----------
  const overEl = document.getElementById('over');
  const overTitle = document.getElementById('overTitle');
  const overScore = document.getElementById('overScore');
  const againBtn = document.getElementById('again');
  const exitBtn = document.getElementById('exit');

  function showOver(won) {
    overTitle.textContent = won ? 'You win!' : 'Computer wins';
    overScore.textContent = 'Final score: ' + player.score + ' – ' + cpu.score;
    againBtn.style.display = ''; exitBtn.style.display = '';
    overEl.classList.remove('hidden');
  }
  againBtn.addEventListener('click', () => showMenu('Play again? Adjust settings if you like'));
  exitBtn.addEventListener('click', () => {
    try { window.close(); } catch (e) {}
    // Browsers usually refuse to close a tab the page didn't open, so show a goodbye screen as well
    overTitle.textContent = 'Thanks for playing!';
    overScore.textContent = 'You can close this tab now.';
    exitBtn.style.display = 'none';
  });

  function showMenu(sub) {
    overEl.classList.add('hidden');
    state = 'menu';
    menuSub.textContent = sub || 'Choose your settings, then start';
    menu.classList.remove('hidden');
    keys.up = keys.down = false;
  }

  function startGame() {
    winScore = clampPts(ptsInput.value);
    ptsInput.value = winScore;
    PADDLE_H = level.paddleH;
    menu.classList.add('hidden');
    if (document.activeElement) document.activeElement.blur();
    newGame();
  }

  // ---------- Audio ----------
  let audioCtx = null;
  function beep(freq, dur = 0.06, type = 'square') {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- Game logic ----------
  function resetBall(dir) {
    ball.x = W / 2; ball.y = H / 2;
    ball.speed = level.serve;
    const angle = (Math.random() * 0.6 - 0.3);
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
  }

  function startRound() {
    resetBall(serveDir);
    cpu.jitter = (Math.random() - 0.5) * level.jitter;
    state = 'playing';
    message = '';
  }

  function newGame() {
    player.score = 0; cpu.score = 0;
    serveDir = Math.random() < 0.5 ? 1 : -1;
    player.y = cpu.y = H / 2 - PADDLE_H / 2;
    state = 'ready';
    message = 'Press SPACE to serve';
    ball.x = W / 2; ball.y = H / 2; ball.vx = ball.vy = 0;
    last = performance.now();
  }

  window.addEventListener('keydown', e => {
    if (state === 'menu') {
      if (e.key === 'Enter' && document.activeElement !== document.getElementById('start')) {
        e.preventDefault(); startGame();
      }
      return; // let inputs and buttons behave normally
    }
    if (e.key === 'Escape') { showMenu('Change settings and start a new game'); return; }
    if (e.key === 'ArrowUp')   { keys.up = true;   e.preventDefault(); }
    if (e.key === 'ArrowDown') { keys.down = true; e.preventDefault(); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'ready' || state === 'point') startRound();
      else if (state === 'playing') { state = 'paused'; message = 'Paused — press SPACE'; }
      else if (state === 'paused') { state = 'playing'; message = ''; last = performance.now(); }
      else if (state === 'over') showMenu('Play again? Adjust settings if you like');
    }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp') keys.up = false;
    if (e.key === 'ArrowDown') keys.down = false;
  });

  function paddleBounce(p, dirOut) {
    const rel = (ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    const clamped = Math.max(-1, Math.min(1, rel));
    const angle = clamped * (Math.PI / 3.2);
    ball.speed = Math.min(ball.speed * level.accel, level.maxSpeed);
    ball.vx = Math.cos(angle) * ball.speed * dirOut;
    ball.vy = Math.sin(angle) * ball.speed;
    beep(dirOut > 0 ? 440 : 330);
  }

  function scorePoint(who) {
    beep(180, 0.2, 'sawtooth');
    if (who === 'player') { player.score++; serveDir = -1; }
    else { cpu.score++; serveDir = 1; }
    ball.vx = ball.vy = 0;
    ball.x = W / 2; ball.y = H / 2;
    if (player.score >= winScore || cpu.score >= winScore) {
      state = 'over';
      message = '';
      showOver(player.score > cpu.score);
    } else {
      state = 'point';
      message = (who === 'player' ? 'Point for you' : 'Point for computer') + ' — SPACE to serve';
    }
  }

  function updateAI(dt) {
    if (ball.vx > 0 && ball.x > W * level.reaction) {
      const t = (cpu.x - ball.x) / ball.vx;
      let py = ball.y + ball.vy * t;
      const range = H - 2 * BALL_R;
      py = ((py - BALL_R) % (2 * range) + 2 * range) % (2 * range);
      if (py > range) py = 2 * range - py;
      py += BALL_R;
      cpu.targetY = py + cpu.jitter;
    } else {
      cpu.targetY = H / 2;
    }
    const center = cpu.y + PADDLE_H / 2;
    const diff = cpu.targetY - center;
    const maxMove = level.aiSpeed * dt;
    if (Math.abs(diff) > 6) cpu.y += Math.sign(diff) * Math.min(maxMove, Math.abs(diff));
    cpu.y = Math.max(0, Math.min(H - PADDLE_H, cpu.y));
  }

  function update(dt) {
    if (state === 'menu') return;
    if (keys.up)   player.y -= PADDLE_SPEED * dt;
    if (keys.down) player.y += PADDLE_SPEED * dt;
    player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

    if (state !== 'playing') return;

    updateAI(dt);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.y < BALL_R)     { ball.y = BALL_R;     ball.vy = Math.abs(ball.vy);  beep(260, 0.04); }
    if (ball.y > H - BALL_R) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); beep(260, 0.04); }

    if (ball.vx < 0 &&
        ball.x - BALL_R <= player.x + PADDLE_W && ball.x + BALL_R >= player.x &&
        ball.y + BALL_R >= player.y && ball.y - BALL_R <= player.y + PADDLE_H) {
      ball.x = player.x + PADDLE_W + BALL_R;
      paddleBounce(player, 1);
    }
    if (ball.vx > 0 &&
        ball.x + BALL_R >= cpu.x && ball.x - BALL_R <= cpu.x + PADDLE_W &&
        ball.y + BALL_R >= cpu.y && ball.y - BALL_R <= cpu.y + PADDLE_H) {
      ball.x = cpu.x - BALL_R;
      paddleBounce(cpu, -1);
      cpu.jitter = (Math.random() - 0.5) * level.jitter * 1.15;
    }

    if (ball.x < -BALL_R * 2) scorePoint('cpu');
    else if (ball.x > W + BALL_R * 2) scorePoint('player');
  }

  // ---------- Rendering ----------
  function draw() {
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, W, H);
    if (bgImg) {
      // "cover" fit, blended so the playground still reads as green
      const s = Math.max(W / bgImg.width, H / bgImg.height);
      const w = bgImg.width * s, h = bgImg.height * s;
      ctx.globalAlpha = 0.45;
      ctx.drawImage(bgImg, (W - w) / 2, (H - h) / 2, w, h);
      ctx.globalAlpha = 1;
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 4;
    ctx.strokeRect(10, 10, W - 20, H - 20);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(10, H / 2); ctx.lineTo(W - 10, H / 2); ctx.stroke();

    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(W / 2, 10); ctx.lineTo(W / 2, H - 10); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 56px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(player.score, W / 2 - 80, 80);
    ctx.fillText(cpu.score, W / 2 + 80, 80);
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('YOU', W / 2 - 80, 104);
    ctx.fillText('COMPUTER', W / 2 + 80, 104);
    ctx.fillText(level.label.toUpperCase() + '  ·  FIRST TO ' + winScore, W / 2, H - 22);

    drawPaddle(player.x, player.y, '#e8d9b5');
    drawPaddle(cpu.x, cpu.y, '#e8d9b5');

    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(ball.x + 3, ball.y + 5, BALL_R, BALL_R * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    if (dogReady) {
      ctx.drawImage(dogImg, ball.x - BALL_R, ball.y - BALL_R, BALL_R * 2, BALL_R * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
    }

    if (message && state !== 'menu') {
      ctx.fillStyle = 'rgba(8,20,32,0.7)';
      ctx.fillRect(0, H / 2 + 50, W, 50);
      ctx.fillStyle = '#fff';
      ctx.font = '22px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(message, W / 2, H / 2 + 83);
    }
  }

  function drawPaddle(x, y, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, PADDLE_W, PADDLE_H, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,100,60,0.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    if (state !== 'paused') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  showMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
